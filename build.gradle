import java.awt.Color
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.1'
group = 'com.unusedunlocked'

base {
    archivesName = 'unused-unlocked'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
}

// ---------------------------------------------------------------------------
// The whole mod (Java sources, resources and the icon) is generated here so the
// repo only needs build.gradle + build.yml.
// ---------------------------------------------------------------------------
def genDir = layout.buildDirectory.dir('generated/unusedunlocked')
def genJava = genDir.map { it.dir('java') }
def genRes = genDir.map { it.dir('resources') }

sourceSets.main.java.srcDir(genJava)
sourceSets.main.resources.srcDir(genRes)

tasks.register('generateModFiles') {
    outputs.upToDateWhen { false }
    doLast {
        System.setProperty('java.awt.headless', 'true')

        def root = genDir.get().asFile
        delete(root)
        def javaRoot = new File(root, 'java/com/unusedunlocked')
        def resRoot = new File(root, 'resources')

        def writeFile = { File f, String text ->
            f.parentFile.mkdirs()
            f.text = text
        }

        // ---------------- icons (logo + item textures) ----------------
        def drawCube = { int size, boolean background, File out, int cTop, int cLeft, int cRight ->
            def img = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def g = img.createGraphics()
            if (size > 32) {
                g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            }
            if (background) {
                g.setColor(new Color(0x1E1B2E))
                int r = size.intdiv(6)
                g.fillRoundRect(0, 0, size, size, r, r)
            }
            double s = (size / 16.0d) * (background ? 0.75d : 1.0d)
            double off = background ? size * 0.125d : 0.0d
            def poly = { List pts, Color fill, Color line ->
                int[] xs = pts.collect { (int) Math.round(it[0] * s + off) } as int[]
                int[] ys = pts.collect { (int) Math.round(it[1] * s + off) } as int[]
                g.setColor(fill)
                g.fillPolygon(xs, ys, xs.length)
                g.setColor(line)
                g.drawPolygon(xs, ys, xs.length)
            }
            def outline = new Color(0x2A1F4D)
            poly([[8d, 1d], [14d, 4.5d], [8d, 8d], [2d, 4.5d]], new Color(cTop), outline)
            poly([[2d, 4.5d], [8d, 8d], [8d, 15d], [2d, 11.5d]], new Color(cLeft), outline)
            poly([[14d, 4.5d], [8d, 8d], [8d, 15d], [14d, 11.5d]], new Color(cRight), outline)
            g.setColor(new Color(0xFFD54F))
            int dot = Math.max(2, (int) Math.round(2 * s))
            g.fillRect((int) Math.round(7 * s + off), (int) Math.round(9 * s + off), dot, dot)
            g.dispose()
            out.parentFile.mkdirs()
            ImageIO.write(img, 'png', out)
        }
        drawCube(128, true, new File(resRoot, 'logo.png'), 0xB48CFF, 0x7B52D6, 0x5A38A8)
        drawCube(16, false, new File(resRoot, 'assets/unusedunlocked/textures/item/block_placer.png'), 0xB48CFF, 0x7B52D6, 0x5A38A8)
        drawCube(16, false, new File(resRoot, 'assets/unusedunlocked/textures/item/mob_placer.png'), 0xFF9C7A, 0xD65A3A, 0xA83A22)

        // ---------------- resources ----------------
        writeFile(new File(resRoot, 'META-INF/neoforge.mods.toml'), '''modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="unusedunlocked"
version="1.1.1"
displayName="Unused Unlocked"
logoFile="logo.png"
authors="You"
description="Type test in chat (singleplayer or multiplayer) to add every unused item, block, armor piece and mob, vanilla and modded, to its creative inventory tab. Blocks and mobs with no item get placer items that work in creative and survival."

[[dependencies.unusedunlocked]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.unusedunlocked]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"
''')

        writeFile(new File(resRoot, 'assets/unusedunlocked/lang/en_us.json'), '''{
  "item.unusedunlocked.block_placer": "Unused Block Placer",
  "item.unusedunlocked.mob_placer": "Unused Mob Placer"
}
''')

        writeFile(new File(resRoot, 'assets/unusedunlocked/models/item/block_placer.json'), '''{
  "parent": "minecraft:item/generated",
  "textures": {
    "layer0": "unusedunlocked:item/block_placer"
  }
}
''')

        writeFile(new File(resRoot, 'assets/unusedunlocked/models/item/mob_placer.json'), '''{
  "parent": "minecraft:item/generated",
  "textures": {
    "layer0": "unusedunlocked:item/mob_placer"
  }
}
''')

        // ---------------- Java ----------------
        writeFile(new File(javaRoot, 'UnusedUnlocked.java'), '''package com.unusedunlocked;

import com.mojang.logging.LogUtils;
import net.minecraft.world.item.Item;
import net.neoforged.api.distmarker.Dist;
import net.neoforged.bus.api.IEventBus;
import net.neoforged.fml.common.Mod;
import net.neoforged.fml.loading.FMLEnvironment;
import net.neoforged.neoforge.registries.DeferredItem;
import net.neoforged.neoforge.registries.DeferredRegister;
import org.slf4j.Logger;

@Mod(UnusedUnlocked.MODID)
public class UnusedUnlocked {
    public static final String MODID = "unusedunlocked";
    public static final Logger LOGGER = LogUtils.getLogger();

    public static final DeferredRegister.Items ITEMS = DeferredRegister.createItems(MODID);
    public static final DeferredItem<BlockPlacerItem> BLOCK_PLACER =
            ITEMS.registerItem("block_placer", BlockPlacerItem::new, new Item.Properties());
    public static final DeferredItem<MobPlacerItem> MOB_PLACER =
            ITEMS.registerItem("mob_placer", MobPlacerItem::new, new Item.Properties());

    public UnusedUnlocked(IEventBus modBus) {
        ITEMS.register(modBus);
        if (FMLEnvironment.dist == Dist.CLIENT) {
            ClientHandler.init();
        }
    }
}
''')

        writeFile(new File(javaRoot, 'BlockPlacerItem.java'), '''package com.unusedunlocked;

import java.util.List;
import java.util.Optional;
import net.minecraft.core.BlockPos;
import net.minecraft.core.component.DataComponents;
import net.minecraft.core.registries.BuiltInRegistries;
import net.minecraft.nbt.CompoundTag;
import net.minecraft.network.chat.Component;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.sounds.SoundSource;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.context.BlockPlaceContext;
import net.minecraft.world.item.context.UseOnContext;
import net.minecraft.world.item.component.CustomData;
import net.minecraft.world.level.Level;
import net.minecraft.world.level.block.Block;
import net.minecraft.world.level.block.SoundType;
import net.minecraft.world.level.block.state.BlockState;
import net.minecraft.world.level.gameevent.GameEvent;
import net.minecraft.world.phys.shapes.CollisionContext;

/**
 * Stands in for blocks that have no usable item of their own. The block it places
 * is stored in the item's custom data, so it works for vanilla and modded blocks.
 */
public class BlockPlacerItem extends Item {
    public static final String TAG = "unused_block";

    public BlockPlacerItem(Properties properties) {
        super(properties);
    }

    public static ItemStack create(Block block) {
        String id = BuiltInRegistries.BLOCK.getKey(block).toString();
        ItemStack stack = new ItemStack(UnusedUnlocked.BLOCK_PLACER.get(), 64);
        CompoundTag tag = new CompoundTag();
        tag.putString(TAG, id);
        stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));
        stack.set(DataComponents.CUSTOM_NAME,
                Component.literal("Block: ").append(block.getName()).append(Component.literal(" [" + id + "]")).withStyle(s -> s.withItalic(false)));
        return stack;
    }

    private static Optional<Block> getBlock(ItemStack stack) {
        CustomData data = stack.get(DataComponents.CUSTOM_DATA);
        if (data == null) {
            return Optional.empty();
        }
        String id = data.copyTag().getString(TAG);
        ResourceLocation rl = ResourceLocation.tryParse(id);
        if (rl == null) {
            return Optional.empty();
        }
        return BuiltInRegistries.BLOCK.getOptional(rl);
    }

    @Override
    public InteractionResult useOn(UseOnContext context) {
        Level level = context.getLevel();
        Player player = context.getPlayer();
        ItemStack stack = context.getItemInHand();

        Optional<Block> optional = getBlock(stack);
        if (optional.isEmpty()) {
            return InteractionResult.FAIL;
        }
        Block block = optional.get();

        BlockPlaceContext placeContext = new BlockPlaceContext(context);
        if (!placeContext.canPlace()) {
            return InteractionResult.FAIL;
        }
        BlockPos pos = placeContext.getClickedPos();

        BlockState state = null;
        try {
            state = block.getStateForPlacement(placeContext);
        } catch (Throwable ignored) {
            // fall back to the default state below
        }
        if (state == null) {
            state = block.defaultBlockState();
        }

        CollisionContext collision = player != null ? CollisionContext.of(player) : CollisionContext.empty();
        if (!level.isUnobstructed(state, pos, collision)) {
            return InteractionResult.FAIL;
        }
        if (!level.setBlock(pos, state, 11)) {
            return InteractionResult.FAIL;
        }

        block.setPlacedBy(level, pos, state, player, stack);

        SoundType sound = state.getSoundType(level, pos, player);
        level.playSound(player, pos, sound.getPlaceSound(), SoundSource.BLOCKS,
                (sound.getVolume() + 1.0F) / 2.0F, sound.getPitch() * 0.8F);
        level.gameEvent(GameEvent.BLOCK_PLACE, pos, GameEvent.Context.of(player, state));

        if (player == null || !player.getAbilities().instabuild) {
            stack.shrink(1);
        }
        return InteractionResult.sidedSuccess(level.isClientSide);
    }
}
''')

        writeFile(new File(javaRoot, 'MobPlacerItem.java'), '''package com.unusedunlocked;

import java.util.List;
import java.util.Optional;
import net.minecraft.core.BlockPos;
import net.minecraft.core.Direction;
import net.minecraft.core.component.DataComponents;
import net.minecraft.core.registries.BuiltInRegistries;
import net.minecraft.nbt.CompoundTag;
import net.minecraft.network.chat.Component;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.server.level.ServerLevel;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.entity.Entity;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.MobSpawnType;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.component.CustomData;
import net.minecraft.world.item.context.UseOnContext;
import net.minecraft.world.level.Level;
import net.minecraft.world.level.block.state.BlockState;
import net.minecraft.world.level.gameevent.GameEvent;

/** Spawn egg stand-in for mobs that have no spawn egg (vanilla and modded). */
public class MobPlacerItem extends Item {
    public static final String TAG = "unused_mob";

    public MobPlacerItem(Properties properties) {
        super(properties);
    }

    public static ItemStack create(EntityType<?> type) {
        String id = BuiltInRegistries.ENTITY_TYPE.getKey(type).toString();
        ItemStack stack = new ItemStack(UnusedUnlocked.MOB_PLACER.get(), 64);
        CompoundTag tag = new CompoundTag();
        tag.putString(TAG, id);
        stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));
        stack.set(DataComponents.CUSTOM_NAME,
                Component.literal("Mob: ").append(type.getDescription()).append(Component.literal(" [" + id + "]")).withStyle(s -> s.withItalic(false)));
        return stack;
    }

    private static Optional<EntityType<?>> getType(ItemStack stack) {
        CustomData data = stack.get(DataComponents.CUSTOM_DATA);
        if (data == null) {
            return Optional.empty();
        }
        ResourceLocation rl = ResourceLocation.tryParse(data.copyTag().getString(TAG));
        if (rl == null) {
            return Optional.empty();
        }
        return BuiltInRegistries.ENTITY_TYPE.getOptional(rl);
    }

    @Override
    public InteractionResult useOn(UseOnContext context) {
        Level level = context.getLevel();
        if (!(level instanceof ServerLevel server)) {
            return InteractionResult.SUCCESS;
        }
        ItemStack stack = context.getItemInHand();
        Optional<EntityType<?>> optional = getType(stack);
        if (optional.isEmpty()) {
            return InteractionResult.FAIL;
        }

        Player player = context.getPlayer();
        BlockPos pos = context.getClickedPos();
        Direction face = context.getClickedFace();
        BlockState state = level.getBlockState(pos);
        BlockPos spawnPos = state.getCollisionShape(level, pos).isEmpty() ? pos : pos.relative(face);

        Entity entity = optional.get().spawn(server, stack, player, spawnPos, MobSpawnType.SPAWN_EGG, true,
                !pos.equals(spawnPos) && face == Direction.UP);
        if (entity == null) {
            return InteractionResult.FAIL;
        }

        if (player == null || !player.getAbilities().instabuild) {
            stack.shrink(1);
        }
        level.gameEvent(player, GameEvent.ENTITY_PLACE, pos);
        return InteractionResult.CONSUME;
    }
}
''')

        writeFile(new File(javaRoot, 'ClientHandler.java'), '''package com.unusedunlocked;

import java.util.ArrayList;
import java.util.Comparator;
import java.util.HashMap;
import java.util.HashSet;
import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.Set;
import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen;
import net.minecraft.client.player.LocalPlayer;
import net.minecraft.core.component.DataComponents;
import net.minecraft.core.registries.BuiltInRegistries;
import net.minecraft.network.chat.Component;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.tags.BlockTags;
import net.minecraft.world.entity.Entity;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.Mob;
import net.minecraft.world.flag.FeatureFlagSet;
import net.minecraft.world.item.ArmorItem;
import net.minecraft.world.item.ArrowItem;
import net.minecraft.world.item.BlockItem;
import net.minecraft.world.item.BowItem;
import net.minecraft.world.item.CreativeModeTab;
import net.minecraft.world.item.CreativeModeTabs;
import net.minecraft.world.item.CrossbowItem;
import net.minecraft.world.item.DiggerItem;
import net.minecraft.world.item.FishingRodItem;
import net.minecraft.world.item.FlintAndSteelItem;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.Items;
import net.minecraft.world.item.ShearsItem;
import net.minecraft.world.item.ShieldItem;
import net.minecraft.world.item.SpawnEggItem;
import net.minecraft.world.item.SwordItem;
import net.minecraft.world.item.TridentItem;
import net.minecraft.world.level.Level;
import net.minecraft.world.level.block.BasePressurePlateBlock;
import net.minecraft.world.level.block.Block;
import net.minecraft.world.level.block.BushBlock;
import net.minecraft.world.level.block.ButtonBlock;
import net.minecraft.world.level.block.DiodeBlock;
import net.minecraft.world.level.block.EntityBlock;
import net.minecraft.world.level.block.PistonBaseBlock;
import net.minecraft.world.level.block.state.BlockState;
import net.neoforged.neoforge.client.event.ClientChatEvent;
import net.neoforged.neoforge.client.event.ScreenEvent;
import net.neoforged.neoforge.common.NeoForge;

/**
 * Client side: typing "test" adds every unused item, block (as a placer item),
 * armor piece and mob (as a placer item) to the matching creative tab.
 */
public final class ClientHandler {
    private record Placement(ResourceLocation tab, ItemStack stack) {
    }

    private static List<Placement> cache = null;
    private static boolean unlocked = false;
    private static int itemCount = 0;
    private static int blockCount = 0;
    private static int mobCount = 0;

    private ClientHandler() {
    }

    public static void init() {
        NeoForge.EVENT_BUS.addListener(ClientHandler::onChat);
        NeoForge.EVENT_BUS.addListener(ClientHandler::onScreenInit);
    }

    private static void onChat(ClientChatEvent event) {
        if (!"test".equalsIgnoreCase(event.getMessage().trim())) {
            return;
        }
        event.setCanceled(true);
        LocalPlayer player = Minecraft.getInstance().player;
        if (player == null) {
            return;
        }
        try {
            if (cache == null) {
                build(player);
            }
            unlocked = true;
            apply();
            player.displayClientMessage(Component.literal("Unused Unlocked: added " + itemCount
                    + " items, " + blockCount + " blocks and " + mobCount
                    + " mobs to the creative tabs. Open your creative inventory."), false);
        } catch (Throwable t) {
            UnusedUnlocked.LOGGER.error("Could not unlock unused content", t);
            player.displayClientMessage(Component.literal("Unused Unlocked: something went wrong, see the log."), false);
        }
    }

    private static void onScreenInit(ScreenEvent.Init.Pre event) {
        if (unlocked && event.getScreen() instanceof CreativeModeInventoryScreen) {
            try {
                apply();
            } catch (Throwable t) {
                UnusedUnlocked.LOGGER.error("Could not update creative tabs", t);
            }
        }
    }

    private static void apply() {
        if (!unlocked || cache == null) {
            return;
        }
        CreativeModeTab search = CreativeModeTabs.searchTab();
        for (Placement placement : cache) {
            Optional<CreativeModeTab> tab = BuiltInRegistries.CREATIVE_MODE_TAB.getOptional(placement.tab());
            if (tab.isPresent()) {
                tab.get().getDisplayItems().add(placement.stack().copy());
                tab.get().getSearchTabDisplayItems().add(placement.stack().copy());
            }
            search.getDisplayItems().add(placement.stack().copy());
            search.getSearchTabDisplayItems().add(placement.stack().copy());
        }
    }

    private static void build(LocalPlayer player) {
        Level level = player.level();
        FeatureFlagSet flags = player.connection.enabledFeatures();

        // Make sure the creative tabs are filled, then see what they already contain.
        CreativeModeTabs.tryRebuildTabContents(flags, false, level.registryAccess());
        Set<Item> listed = new HashSet<>();
        Map<String, ResourceLocation> modTabs = new HashMap<>();
        for (CreativeModeTab tab : BuiltInRegistries.CREATIVE_MODE_TAB) {
            ResourceLocation tabId = BuiltInRegistries.CREATIVE_MODE_TAB.getKey(tab);
            if (tab.getType() != CreativeModeTab.Type.CATEGORY) {
                continue;
            }
            for (ItemStack stack : tab.getDisplayItems()) {
                listed.add(stack.getItem());
            }
            if (tabId != null && !"minecraft".equals(tabId.getNamespace())) {
                modTabs.putIfAbsent(tabId.getNamespace(), tabId);
            }
        }

        List<Placement> result = new ArrayList<>();

        // 1) Unused items (this includes unused armor, tools, food, spawn eggs...).
        List<Item> items = new ArrayList<>();
        for (Item item : BuiltInRegistries.ITEM) {
            if (item == Items.AIR || item == UnusedUnlocked.BLOCK_PLACER.get()
                    || item == UnusedUnlocked.MOB_PLACER.get()) {
                continue;
            }
            if (!item.isEnabled(flags) || listed.contains(item)) {
                continue;
            }
            items.add(item);
        }
        items.sort(Comparator.comparing(i -> BuiltInRegistries.ITEM.getKey(i).toString()));
        for (Item item : items) {
            ItemStack stack = new ItemStack(item);
            ResourceLocation id = BuiltInRegistries.ITEM.getKey(item);
            result.add(new Placement(tabFor(id, categorizeItem(item, stack), modTabs), stack));
        }
        itemCount = items.size();

        // 2) Blocks that have no item at all (couplers, portals, plants...) get a placer item.
        List<Block> blocks = new ArrayList<>();
        for (Block block : BuiltInRegistries.BLOCK) {
            if (block.asItem() != Items.AIR) {
                continue;
            }
            if (block.defaultBlockState().isAir() || !block.isEnabled(flags)) {
                continue;
            }
            blocks.add(block);
        }
        blocks.sort(Comparator.comparing(b -> BuiltInRegistries.BLOCK.getKey(b).toString()));
        for (Block block : blocks) {
            ResourceLocation id = BuiltInRegistries.BLOCK.getKey(block);
            result.add(new Placement(tabFor(id, categorizeBlock(block), modTabs), BlockPlacerItem.create(block)));
        }
        blockCount = blocks.size();

        // 3) Mobs without a spawn egg get a placer item.
        List<EntityType<?>> types = new ArrayList<>();
        for (EntityType<?> type : BuiltInRegistries.ENTITY_TYPE) {
            if (!type.canSummon() || !type.isEnabled(flags) || SpawnEggItem.byId(type) != null) {
                continue;
            }
            try {
                Entity entity = type.create(level);
                if (entity != null) {
                    if (entity instanceof Mob) {
                        types.add(type);
                    }
                    entity.discard();
                }
            } catch (Throwable ignored) {
                // skip entities that cannot be created here
            }
        }
        types.sort(Comparator.comparing(t -> BuiltInRegistries.ENTITY_TYPE.getKey(t).toString()));
        for (EntityType<?> type : types) {
            ResourceLocation id = BuiltInRegistries.ENTITY_TYPE.getKey(type);
            result.add(new Placement(tabFor(id, CreativeModeTabs.SPAWN_EGGS.location(), modTabs),
                    MobPlacerItem.create(type)));
        }
        mobCount = types.size();

        cache = result;
    }

    /** Modded content goes into its own mod's creative tab when it has one. */
    private static ResourceLocation tabFor(ResourceLocation id, ResourceLocation fallback,
                                           Map<String, ResourceLocation> modTabs) {
        if (id != null && !"minecraft".equals(id.getNamespace())) {
            ResourceLocation modTab = modTabs.get(id.getNamespace());
            if (modTab != null) {
                return modTab;
            }
        }
        return fallback;
    }

    private static ResourceLocation categorizeItem(Item item, ItemStack stack) {
        if (item instanceof SpawnEggItem) {
            return CreativeModeTabs.SPAWN_EGGS.location();
        }
        if (item instanceof ArmorItem || item instanceof ShieldItem || item instanceof BowItem
                || item instanceof CrossbowItem || item instanceof TridentItem || item instanceof SwordItem
                || item instanceof ArrowItem) {
            return CreativeModeTabs.COMBAT.location();
        }
        if (item instanceof DiggerItem || item instanceof ShearsItem || item instanceof FlintAndSteelItem
                || item instanceof FishingRodItem) {
            return CreativeModeTabs.TOOLS_AND_UTILITIES.location();
        }
        if (stack.has(DataComponents.FOOD)) {
            return CreativeModeTabs.FOOD_AND_DRINKS.location();
        }
        if (item instanceof BlockItem blockItem) {
            return categorizeBlock(blockItem.getBlock());
        }
        return CreativeModeTabs.INGREDIENTS.location();
    }

    private static ResourceLocation categorizeBlock(Block block) {
        BlockState state = block.defaultBlockState();
        if (state.isSignalSource() || block instanceof DiodeBlock || block instanceof PistonBaseBlock
                || block instanceof BasePressurePlateBlock || block instanceof ButtonBlock) {
            return CreativeModeTabs.REDSTONE_BLOCKS.location();
        }
        if (block instanceof EntityBlock) {
            return CreativeModeTabs.FUNCTIONAL_BLOCKS.location();
        }
        if (block instanceof BushBlock || state.is(BlockTags.LEAVES) || state.is(BlockTags.LOGS)) {
            return CreativeModeTabs.NATURAL_BLOCKS.location();
        }
        return CreativeModeTabs.BUILDING_BLOCKS.location();
    }
}
''')
    }
}

tasks.named('compileJava') {
    dependsOn 'generateModFiles'
}
tasks.named('processResources') {
    dependsOn 'generateModFiles'
}
