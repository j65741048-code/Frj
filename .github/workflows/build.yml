name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add mod icon (brass train)
        shell: bash
        run: |
          mkdir -p src/main/resources
          echo "" | base64 -d > src/main/resources/logo.png
          file src/main/resources/logo.png || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo
            echo "################ THE ERRORS ARE HERE ################"
            if grep -q "error:" build.log; then
              grep -n "error:" -A3 build.log | head -60
            else
              grep -n -E "What went wrong|Caused by|Could not|FAILED" -A4 build.log | head -60
            fi
            echo "################ END OF ERRORS ################"
          fi
          exit $status

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: unused-unlocked-1.2.0
          path: build/libs/*.jar
          if-no-files-found: error
