name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        shell: bash
        run: gradle build --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          echo "===== COMPILER / BUILD ERRORS ====="
          grep -n -E "error:|What went wrong|Caused by|Could not|FAILED" -A3 build.log | head -80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: unused-unlocked
          path: build/libs/*.jar
          if-no-files-found: error
